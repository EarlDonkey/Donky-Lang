<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Donky Defender</title>
<style>
  :root {
    --bg: #0a0a0c;
    --panel: #121216;
    --panel-2: #17171d;
    --border: #23232b;
    --text: #e6e6ea;
    --muted: #8a8a95;
    --accent: #e08e4a;
    --accent-dim: #a8632f;
    --danger: #e05a5a;
    --ok: #4ea86a;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
  }
  header {
    width: 100%;
    max-width: 880px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  header h1 {
    margin: 0;
    font-size: 18px;
    letter-spacing: .04em;
    font-weight: 600;
  }
  header h1 .dot { color: var(--accent); }
  header .sub { color: var(--muted); font-size: 12px; font-family: var(--mono); }

  .scan-wrap {
    width: 100%;
    max-width: 880px;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 8px 0 28px;
  }
  #scanBtn {
    background: var(--accent);
    color: #1a1108;
    border: 0;
    border-radius: 10px;
    padding: 16px 40px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .02em;
    cursor: pointer;
    transition: background .15s, transform .05s;
    box-shadow: 0 0 0 1px #000 inset, 0 8px 30px -12px var(--accent);
  }
  #scanBtn:hover { background: #ef9c57; }
  #scanBtn:active { transform: translateY(1px); }
  #scanBtn:disabled { background: var(--accent-dim); cursor: progress; }
  #status { margin-top: 14px; color: var(--muted); font-family: var(--mono); font-size: 12px; min-height: 18px; }

  .grid {
    width: 100%;
    max-width: 880px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 18px 14px;
    min-height: 180px;
    display: flex;
    flex-direction: column;
  }
  .card h2 {
    margin: 0 0 12px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card h2 .count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 1px 8px;
  }
  .findings { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .findings li {
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.45;
    color: #f1c9a4;
    background: #1d1409;
    border: 1px solid #3a2512;
    border-left: 3px solid var(--danger);
    border-radius: 6px;
    padding: 8px 10px;
    word-break: break-word;
  }
  .findings li.warn {
    color: var(--muted);
    background: var(--panel-2);
    border-color: var(--border);
    border-left-color: var(--accent-dim);
  }
  .clean {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--ok);
    font-family: var(--mono);
    font-size: 12px;
    padding: 10px 0 2px;
  }
  .clean .badge {
    display: inline-block;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 10px var(--ok);
  }
  .empty { color: var(--muted); font-size: 12px; font-family: var(--mono); }
  footer {
    margin-top: 28px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
  }
  footer .accent { color: var(--accent); }
</style>
</head>
<body>
  <header>
    <h1>Donky Defender <span class="dot">●</span></h1>
    <div class="sub">v1.0 · local · read-only</div>
  </header>

  <div class="scan-wrap">
    <button id="scanBtn">Run Scan</button>
    <div id="status">idle</div>
  </div>

  <div class="grid">
    <section class="card">
      <h2>Suspicious Processes <span class="count" id="procCount">0</span></h2>
      <ul class="findings" id="procList"></ul>
      <div class="empty" id="procEmpty">no scan yet</div>
    </section>
    <section class="card">
      <h2>Suspicious Startup Entries <span class="count" id="startCount">0</span></h2>
      <ul class="findings" id="startList"></ul>
      <div class="empty" id="startEmpty">no scan yet</div>
    </section>
  </div>

  <footer>Scan reads <span class="accent">PROCESS_QUERY_LIMITED_INFORMATION</span> and <span class="accent">HKCU\…\Run</span> only. No writes.</footer>

<script>
  const $ = (id) => document.getElementById(id);
  const scanBtn = $("scanBtn");
  const statusEl = $("status");

  function renderList(listEl, emptyEl, countEl, items) {
    listEl.innerHTML = "";
    if (!items || items.length === 0) {
      listEl.style.display = "none";
      emptyEl.style.display = "block";
      emptyEl.className = "clean";
      emptyEl.innerHTML = '<span class="badge"></span> Clean — no indicators found.';
      countEl.textContent = "0";
      return;
    }
    listEl.style.display = "flex";
    emptyEl.style.display = "none";
    countEl.textContent = String(items.length);
    for (const it of items) {
      const li = document.createElement("li");
      // [WARN]/[ERROR] entries render muted; real findings render amber.
      if (it.startsWith("[WARN]") || it.startsWith("[ERROR]")) li.className = "warn";
      li.textContent = it;
      listEl.appendChild(li);
    }
  }

  async function runScan() {
    scanBtn.disabled = true;
    statusEl.textContent = "scanning…";
    const t0 = performance.now();
    try {
      const res = await fetch("/api/scan", { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const procs = data.processes || [];
      const startup = data.startup || [];

      // Count *real* findings (drop [WARN]/[ERROR] advisory lines from the
      // badge so it matches the CLI's "K suspicious" count).
      const realProcs = procs.filter(x => !x.startsWith("[WARN]") && !x.startsWith("[ERROR]"));
      const realStart = startup.filter(x => !x.startsWith("[WARN]") && !x.startsWith("[ERROR]"));

      renderList($("procList"), $("procEmpty"), $("procCount"), procs);
      renderList($("startList"), $("startEmpty"), $("startCount"), startup);

      const dt = Math.round(performance.now() - t0);
      const total = realProcs.length + realStart.length;
      statusEl.textContent =
        "scanned " + (data.process_count ?? "?") + " processes, " +
        (data.startup_count ?? "?") + " startup entries in " + dt + "ms — " +
        (total === 0 ? "clean" : total + " suspicious");
      statusEl.style.color = total === 0 ? "var(--ok)" : "var(--danger)";
    } catch (e) {
      statusEl.textContent = "scan failed: " + e.message;
      statusEl.style.color = "var(--danger)";
    } finally {
      scanBtn.disabled = false;
    }
  }

  scanBtn.addEventListener("click", runScan);
</script>
</body>
</html>
